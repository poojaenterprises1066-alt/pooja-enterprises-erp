 const el=$('entries');

function dateSortKey(value){
 const raw=String(value||'').trim();
 let m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
 if(m)return Number(m[1])*10000+Number(m[2])*100+Number(m[3]);
 m=raw.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);
 if(m)return Number(m[3])*10000+Number(m[2])*100+Number(m[1]);
 return 99999999;
}
function sortEntriesDateWise(){
 // Keep dates chronological; when multiple entries share a date, show
 // their permanent ledger serial numbers in ascending order (39 before 40).
 entries=entries.map((e,i)=>({...e,_sortOrder:i,_dateKey:dateSortKey(e.date)}))
  .sort((a,b)=>a._dateKey-b._dateKey||
    (Number(a.serialNo)||0)-(Number(b.serialNo)||0)||
    a._sortOrder-b._sortOrder)
  .map(({_sortOrder,_dateKey,...e})=>e);
}
function persist(){
 let maxSerial=0;entries.forEach(e=>{const n=Number(e.serialNo);if(Number.isInteger(n)&&n>maxSerial)maxSerial=n;});
 entries.forEach(e=>{if(!(Number.isInteger(Number(e.serialNo))&&Number(e.serialNo)>0))e.serialNo=++maxSerial;});
 nextLedgerSerial=Math.max(nextLedgerSerial,maxSerial+1);
 sortEntriesDateWise();
 renumberLedger();
 localStorage.setItem('balance-ledger',JSON.stringify(entries));render()
}

$('backupFile').addEventListener('change',async ev=>{

  const parsed=JSON.parse(await file.text());
  const imported=Array.isArray(parsed)?parsed:parsed.entries;
  if(!Array.isArray(imported)||!imported.every(e=>e&&typeof e==='object'&&typeof e.date==='string'&&typeof e.restion==='string'))
   throw new Error('This file is not a valid Balance Ledger backup.');
  if(!confirm('Current ledger data will be replaced by '+imported.length+' backup entries. Continue?'))return;
  entries=imported.map(e=>({date:e.date,restion:e.restion,serialNo:Number(e.serialNo)||undefined,balance:Number(e.balance)||0,credit:Number(e.credit)||0,debit:Number(e.debit)||0,total:Number(e.total)||0,remark:String(e.remark||''),createdBy:String(e.createdBy||'Legacy'),editedBy:String(e.editedBy||'—')}));
  persist();alert('Backup restored successfully. '+entries.length+' entries loaded.');
 }catch(err){alert('Restore failed: '+(err?.message||err));}

});
